########################################################################
#                              Python                                  #
########################################################################

[[language]]
name = "python"
language-servers = ["ty", "ruff"]
auto-format = false

[language-server.ruff.config.settings]
lineLength = 80
configurationPreference = "filesystemFirst"

[language-server.ruff.config.settings.lint]
select = ["E4", "E7"]

[language-server.ruff.config.settings.format]
preview = true

########################################################################
#                               LaTeX                                  #
########################################################################
[[language]]
name = "latex"
language-servers = ["texlab"]
scope = "source.tex"
file-types = ["tex"]
auto-format = false
comment-token = "%"
indent = {tab-width = 2, unit="   "}

[language-server.texlab]
command = "texlab"

[language-server.texlab.config.texlab.chktex]
onOpenAndSave = true
onEdit = true
additionalArgs = ["-n1", "-n24"]

########################################################################
#                             Fortran                                  #
########################################################################

[language-server.fortls]

[language-server.fortitude]
command = "fortitude"
args = ["server", "--preview"]

[[language]]
name = "fortran"
file-types = ["f90", "fpp"]
indent = {tab-width = 2, unit = "  "}
language-servers = ["fortls", "fortitude"]
